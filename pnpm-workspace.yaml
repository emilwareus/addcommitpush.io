  sharp: 0.35.5
  protobufjs: '>=7.6.1'
  dompurify: '>=3.4.16'
  katex: '>=0.18.2'
  esbuild: '>=0.28.1'
  '@babel/core': '>=7.29.6'
  brace-expansion@^1.1.0: 1.1.21
  brace-expansion@^5.0.0: 5.0.12
  js-yaml@^3: 3.15.2
  js-yaml@^4: 4.3.2
  nanoid@^3: 3.3.20
  fflate: '>=0.4.9'
  source-map-js: '>=1.2.2'
  baseline-browser-mapping: '>=2.11.0'

onlyBuiltDependencies:
